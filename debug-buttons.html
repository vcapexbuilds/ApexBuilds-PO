<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Buttons Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 15px; margin: 10px; cursor: pointer; }
        .btn-secondary { background: #6c757d; color: white; border: none; border-radius: 4px; }
        .log { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Debug Form Buttons Test</h1>
    
    <div>
        <h3>Test Add Buttons</h3>
        <button type="button" id="addScheduleItem" class="btn-secondary">Add Schedule Item</button>
        <button type="button" id="addScopeItem" class="btn-secondary">Add Scope Item</button>
    </div>

    <div>
        <h3>Container Elements</h3>
        <div id="scheduleItems" style="border: 1px solid #ddd; padding: 10px; margin: 10px 0;">
            <p>Schedule items will appear here</p>
        </div>
        
        <div id="scopeItems" style="border: 1px solid #ddd; padding: 10px; margin: 10px 0;">
            <p>Scope items will appear here</p>
        </div>
    </div>

    <div>
        <h3>Debug Log</h3>
        <div id="debugLog" class="log">Waiting for tests...</div>
    </div>

    <script>
        const log = (msg) => {
            console.log(msg);
            const debugLog = document.getElementById('debugLog');
            debugLog.innerHTML += '<div>' + msg + '</div>';
        };

        // Test basic button clicking
        document.addEventListener('DOMContentLoaded', () => {
            log('DOM loaded, testing buttons...');
            
            const addScheduleBtn = document.getElementById('addScheduleItem');
            const addScopeBtn = document.getElementById('addScopeItem');
            
            log('Schedule button found: ' + (!!addScheduleBtn));
            log('Scope button found: ' + (!!addScopeBtn));
            
            if (addScheduleBtn) {
                addScheduleBtn.addEventListener('click', () => {
                    log('✅ Schedule button clicked!');
                    const container = document.getElementById('scheduleItems');
                    const newItem = document.createElement('div');
                    newItem.innerHTML = '<p>New schedule item added at ' + new Date().toLocaleTimeString() + '</p>';
                    container.appendChild(newItem);
                });
                log('✅ Schedule button event listener added');
            } else {
                log('❌ Schedule button not found');
            }
            
            if (addScopeBtn) {
                addScopeBtn.addEventListener('click', () => {
                    log('✅ Scope button clicked!');
                    const container = document.getElementById('scopeItems');
                    const newItem = document.createElement('div');
                    newItem.innerHTML = '<p>New scope item added at ' + new Date().toLocaleTimeString() + '</p>';
                    container.appendChild(newItem);
                });
                log('✅ Scope button event listener added');
            } else {
                log('❌ Scope button not found');
            }
        });
    </script>
</body>
</html>
